[project]
name = "gymtracker-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "pydantic-settings",
  "python-dotenv",
  "psycopg2-binary",
  "alembic",
  "passlib[bcrypt]",
  "bcrypt<4.1",
  "pydantic[email]"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = []